name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes de validação dos dados
        run: pytest -q
      - name: Os JSON publicados correspondem ao pipeline
        run: |
          python pipeline.py --saida /tmp/dados
          diff -r dados /tmp/dados

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Caminhos sob /sankey-fiscal/ e build de produção sem o parâmetro de teste
        run: node scripts/conferir-bundle.mjs dist
