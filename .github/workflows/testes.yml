name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes de validação dos dados
        run: pytest -q
      - name: Os JSON publicados correspondem ao pipeline
        run: |
          python pipeline.py --saida /tmp/dados
          diff -r dados /tmp/dados
